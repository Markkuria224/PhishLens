[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishlens"
version = "1.0.0"
description = "Desktop Phishing URL Analysis Application"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.1",
]

[project.scripts]
phishlens = "phishlens.main:main"

[tool.setuptools.packages.find]
where = ["src"]
